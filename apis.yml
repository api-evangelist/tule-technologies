name: Tule Technologies
description: Tule Technologies was an agricultural technology company that measured crop water stress
  and actual evapotranspiration (ET) directly in the field, giving growers irrigation guidance through
  its FieldStat monitoring tool for orchards, vineyards, and row crops. Backed by Bloomberg Beta, Tule
  has been acquired by and integrated into CropX; the tuletechnologies.com domain now 301-redirects to
  cropx.com, where Tule's ET monitoring is combined with soil sensing, weather data, and irrigation
  management in one platform. Enrichment found no independent public API, developer portal, SDK, or
  documented developer program for Tule Technologies.
